<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>公路 · 个人版</title>
<script src="vendor/xlsx.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --accent:#0071E3; --accent-soft:rgba(0,113,227,.10);
  --green:#34C759; --green-soft:rgba(52,199,89,.12);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.10);
  --orange:#FF9500; --orange-soft:rgba(255,149,0,.10);
  --text:#1D1D1F; --text2:#6E6E73; --text3:#A1A1A6;
  --bg:#F5F5F7; --card:#FFFFFF; --fill:rgba(120,120,128,.12); --sep:rgba(0,0,0,.05);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.75);
}
body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif; background:#E8E8EA; display:flex; justify-content:center; min-height:100vh; }
#app { width:100%; max-width:430px; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; position:relative; box-shadow:0 0 32px rgba(0,0,0,.14); }
.header { line-height:26px; background:var(--glass); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); padding:18px 20px 14px; font-size:20px; font-weight:700; color:var(--text); position:sticky; top:0; z-index:10; border-bottom:1px solid var(--sep); }
.header .back { color:var(--accent); font-size:15px; font-weight:400; margin-right:8px; cursor:pointer; }
.body { flex:1; overflow-y:auto; padding:14px 14px 100px; }
.tabbar { position:fixed; bottom:0; width:100%; max-width:430px; display:flex; background:var(--glass); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:1px solid var(--sep); padding:8px 0 22px; z-index:20; }
.tab { line-height:14px; flex:1; text-align:center; font-size:10.5px; font-weight:400; color:var(--text3); cursor:pointer; transition:color .18s ease; }
.tab .ic { display:flex; justify-content:center; margin-bottom:3px; }
.tab .ic svg { width:24px; height:24px; display:block; }
.tab.on { color:var(--accent); }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
.quick { display:flex; background:var(--card); border-radius:16px; padding:18px 0 14px; margin-bottom:14px; box-shadow:var(--shadow); }
.quick div { flex:1; text-align:center; font-size:11.5px; color:var(--text2); cursor:pointer; transition:transform .12s ease; }
.quick div:active { transform:scale(.93); }
.quick span { display:flex; justify-content:center; margin-bottom:6px; color:var(--accent); }
.quick span svg { width:26px; height:26px; display:block; }
.mod { line-height:22px; font-size:16px; font-weight:700; color:var(--text); padding:12px 4px 8px; cursor:pointer; }
.mod .arrow { float:right; color:var(--text3); font-weight:400; transition:transform .2s ease; }
.gname { line-height:18px; font-size:12px; color:var(--text3); padding:4px 2px 6px; }
.row { line-height:20px; display:flex; justify-content:space-between; align-items:center; padding:12px 2px; font-size:15px; color:var(--text); cursor:pointer; transition:opacity .15s ease; }
.row:active { opacity:.5; }
.row em { font-style:normal; color:var(--text3); font-size:13px; }
.row+.row { border-top:1px solid var(--sep); }
/* quiz */
.qprog { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text2); background:var(--glass); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); margin:-14px -14px 14px; padding:12px 18px; border-bottom:1px solid var(--sep); }
.qflag { color:var(--orange); cursor:pointer; }
.stem { font-size:16.5px; line-height:27px; color:var(--text); margin-bottom:18px; font-weight:400; }
.opt { background:var(--card); border:1.5px solid transparent; box-shadow:var(--shadow); border-radius:14px; padding:14px 16px; font-size:15px; color:var(--text); margin-bottom:10px; cursor:pointer; line-height:23px; transition:border-color .15s ease, background .15s ease, transform .1s ease; }
.opt:active { transform:scale(.985); }
.opt.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.opt.right { border-color:var(--green); background:var(--green-soft); color:#1D7A38; }
.opt.wrong { border-color:var(--red); background:var(--red-soft); color:#C4281F; }
.ana { background:var(--orange-soft); border-radius:14px; padding:16px; margin-top:10px; }
.ana b { font-size:14px; color:var(--orange); display:block; margin-bottom:6px; }
.ana p { font-size:14px; color:var(--text2); line-height:23px; }
.btn { display:block; width:100%; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; margin-top:12px; transition:opacity .15s ease, transform .1s ease; }
.btn:active { opacity:.75; transform:scale(.98); }
.btn:disabled { opacity:.35; }
.btn.ghost { background:var(--fill); color:var(--accent); }
.center { text-align:center; padding:60px 20px; }
.bigscore { font-size:56px; font-weight:700; color:var(--accent);  }
.rline { font-size:15px; color:var(--text2); margin-top:8px; }
.passtag { font-size:15px; color:var(--green); font-weight:700; margin-top:10px; }
.hint { line-height:18px; font-size:12px; color:var(--text3); margin-top:14px; }
.empty { text-align:center; color:var(--text3); margin-top:80px; font-size:14px; }
/* mistake */
.mtag { font-size:12px; color:var(--accent); flex:1; }
.redtag { font-size:12px; color:var(--red); font-weight:700; }
.marktag { font-size:12px; color:var(--orange); margin-left:6px; }
.mrow { display:flex; align-items:center; margin-bottom:8px; }
.mstem { font-size:14px; color:var(--text); line-height:23px; margin-bottom:10px; }
.reasons { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.reason { border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--text2); background:var(--fill); cursor:pointer; transition:background .15s ease, color .15s ease; }
.reason.on { background:var(--accent-soft); color:var(--accent); font-weight:700; }
.resolve { font-size:13px; color:var(--green); cursor:pointer; }
/* course */
.actions { display:flex; gap:10px; margin-bottom:12px; }
.actions button { flex:1; background:var(--card); box-shadow:var(--shadow); border:none; border-radius:14px; padding:14px 0; font-size:14px; font-weight:400; color:var(--text); cursor:pointer; transition:transform .1s ease; }
.actions button:active { transform:scale(.96); }
.vcard { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; }
.vplay { color:var(--accent); font-size:22px; }
.vtitle { line-height:21px; font-size:15px; color:var(--text); line-height:21px; }
.vmeta { line-height:18px; font-size:12px; color:var(--text3); margin-top:4px; }
.vdel { color:var(--text3); font-size:16px; padding:4px; }
video { width:100%; border-radius:14px; background:#000; margin-top:8px; }
/* recite */
.duecount { font-size:16px; font-weight:700; color:var(--text); margin-bottom:8px; }
.modes { display:flex; gap:16px; font-size:14px; color:var(--text3); margin-bottom:12px; align-items:center; }
.modes b { color:var(--accent); cursor:pointer; font-weight:700; }
.modes span { cursor:pointer; }
.rcard { background:var(--card); border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; }
.rtag { line-height:15px; font-size:11px; color:var(--text3); margin-bottom:6px; }
.rfront { font-size:16px; color:var(--text); font-weight:700; line-height:25px; }
.rback { font-size:14px; color:var(--text2); line-height:23px; border-top:1px solid var(--sep); margin-top:12px; padding-top:12px; }
.rhint { line-height:18px; font-size:12px; color:var(--text3); margin-top:8px; }
.rrow { display:flex; gap:10px; margin-top:14px; }
.rrow button { flex:1; border:none; border-radius:12px; padding:11px; font-size:14px; font-weight:700; cursor:pointer; transition:transform .1s ease; }
.rrow button:active { transform:scale(.95); }
.rno { background:var(--red-soft); color:var(--red); } .ryes { background:var(--green-soft); color:#1D7A38; }
/* mindmap */
.mmap { line-height:22px; background:var(--card); border-radius:16px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow); font-size:16px; font-weight:700; color:var(--text); cursor:pointer; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.chips span { background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:400; }
/* profile */
.pname { line-height:28px; font-size:22px; font-weight:700; color:var(--text); margin-top:8px;  }
.pslogan { font-size:13px; color:var(--text3); margin:4px 0 16px; }
.pgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.pcell { background:var(--card); border-radius:16px; box-shadow:var(--shadow); text-align:center; padding:18px 0; }
.pv { line-height:28px; font-size:22px; font-weight:700; color:var(--accent);  }
.pl { line-height:15px; font-size:11.5px; color:var(--text3); margin-top:4px; }
.ptitle { line-height:20px; font-size:15px; font-weight:700; color:var(--text); margin-bottom:10px; }
.pline { line-height:22px; font-size:13px; color:var(--text2); line-height:23px; }
.ppass { line-height:22px; font-size:13px; color:var(--green); line-height:23px; }
/* import */
.iline { line-height:22px; font-size:13px; color:var(--text2); line-height:23px; }
.log { line-height:22px; font-size:13px; color:var(--text); line-height:23px; }
input[type=text], textarea { width:100%; background:var(--fill); border:none; border-radius:12px; padding:12px 14px; font-size:14px; margin-bottom:10px; font-family:inherit; color:var(--text); outline:none; transition:box-shadow .15s ease; }
input[type=text]:focus, textarea:focus { box-shadow:0 0 0 3px var(--accent-soft); }
textarea { height:84px; resize:none; }
input[type=file] { display:none; }
.btag { font-size:10px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:2px 7px; margin-left:6px; font-weight:400; }
.delbtn { font-size:11px; color:var(--red); margin-left:10px; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.30); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:99; }
.dialog { background:var(--card); border-radius:18px; padding:22px; width:78%; max-width:320px; box-shadow:0 16px 48px rgba(0,0,0,.22); }
.dmsg { font-size:14px; line-height:23px; color:var(--text); margin-bottom:18px; }
.drow { display:flex; gap:10px; }
.drow button { flex:1; margin:0; }
.toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:rgba(28,28,30,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; font-size:13px; line-height:20px; padding:11px 18px; border-radius:999px; max-width:80%; z-index:100; }
.qtimer { font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums; background:var(--fill); border-radius:999px; padding:3px 9px; }
.warnbar { background:var(--orange-soft); color:var(--orange); font-size:12.5px; line-height:18px; padding:9px 13px; border-radius:12px; margin-bottom:10px; font-weight:400; }
.qsrc { line-height:16px; font-size:11px; color:var(--text3); margin:-8px 0 12px; }
.mans { font-size:12px; color:var(--text2); margin:6px 0; }
.mat { background:var(--fill); border-radius:14px; padding:16px; font-size:13px; line-height:23px; color:var(--text); max-height:340px; overflow-y:auto; white-space:pre-wrap; margin-bottom:12px; }
.stem img { max-width:100%; height:auto; border-radius:8px; margin:6px 0; }
.ana img { max-width:60%; height:auto; vertical-align:middle; }
.imgmiss::after { content:'（题图缺失）'; color:var(--text3); font-size:12px; }
/* ===== 暗色（Apple Dark） ===== */
#app.theme-dark {
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.16);
  --green:#30D158; --green-soft:rgba(48,209,88,.16);
  --red:#FF453A; --red-soft:rgba(255,69,58,.16);
  --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16);
  --text:#F5F5F7; --text2:#A1A1A6; --text3:#6E6E73;
  --bg:#000000; --card:#1C1C1E; --fill:rgba(120,120,128,.22); --sep:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --glass:rgba(28,28,30,.72);
}
#app.theme-dark .opt.right { color:var(--green); }
#app.theme-dark .opt.wrong { color:var(--red); }
#app.theme-dark .ryes { color:var(--green); }
#app.theme-dark .trendline { stroke:#4A4C55; }
/* ===== 配色方案 ===== */
#app.pal-yellow { --accent:#D9930D; --accent-soft:rgba(217,147,13,.13); }
#app.pal-blue { --accent:#5B7C99; --accent-soft:rgba(91,124,153,.15); }
#app.theme-dark.pal-yellow { --accent:#F5B32B; --accent-soft:rgba(245,179,43,.18); }
#app.theme-dark.pal-blue { --accent:#8AB0CC; --accent-soft:rgba(138,176,204,.20); }
#app.pal-yellow .header { background:rgba(247,199,72,.88); }
#app.theme-dark.pal-yellow .header { background:rgba(66,52,10,.80); }
.palcard { display:flex; align-items:center; gap:12px; background:var(--fill); border-radius:14px; padding:13px 16px; margin-bottom:8px; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; border:1.5px solid transparent; transition:border-color .15s ease; }
.palcard.on { border-color:var(--accent); background:var(--accent-soft); }
.paldots { display:flex; gap:5px; }
.paldots i { width:16px; height:16px; border-radius:50%; display:block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.10); }
.palcheck { margin-left:auto; color:var(--accent); visibility:hidden; }
.palcard.on .palcheck { visibility:visible; }
/* ===== 打卡日历热力图 ===== */
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px; }
.calhead { font-size:10px; color:var(--text3); text-align:center; }
.calcell { aspect-ratio:1; border-radius:8px; font-size:10.5px; display:flex; align-items:center; justify-content:center; color:var(--text2); background:var(--fill); position:relative; }
.calcell.today { box-shadow:0 0 0 1.5px var(--accent); }
.calcell .cdot { position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--orange); }
.calnav { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text2); }
.calnav b { color:var(--text); font-size:14px; }
.calnav span { cursor:pointer; padding:4px 12px; color:var(--accent); }
/* ===== 字体 ===== */
#app.font-serif { font-family:"Songti SC","STSong","STZhongsong","SimSun",serif; }
#app.font-rounded { font-family:"Yuanti SC","YouYuan","Arial Rounded MT Bold","Microsoft YaHei",sans-serif; }
/* ===== 字号 ===== */
#app.size-small .body { zoom:.94; }
#app.size-large .body { zoom:1.12; }
#app.size-xl .body { zoom:1.25; }
</style>

<body>
<div id="app"></div>
<script>
/* 题图缺失时优雅降级：隐藏破图并提示（手机精简版未内置 image 资源） */
document.addEventListener('error', function(e){
  var t = e.target;
  if(t && t.tagName === 'IMG'){
    t.style.display = 'none';
    if(t.parentNode) t.parentNode.classList.add('imgmiss');
  }
}, true);
/* ================= 数据层 (localStorage) ================= */
const DB_KEY = 'kg_db_v1';
const EBBINGHAUS = [1,2,4,7,15,30];
let DB = load();
/* 旧版示例题考点名 → 新版考点名（按题干特征归类），保证老数据不丢 */
function migrateOldPoints(){
  if(!Array.isArray(DB.questions)) return;
  const byStem=(s)=>{
    if(/排序/.test(s)) return '排序与查找';
    if(/OSI|TCP/.test(s)) return '体系结构与协议';
    if(/范式|部分函数依赖/.test(s)) return '关系模型与范式';
    if(/死锁/.test(s)) return '死锁';
    if(/加密/.test(s)) return '网络安全';
    if(/ACID|事务/.test(s)) return 'SQL与事务';
    if(/软件测试|需求分析|UML/.test(s)) return '软件与工程';
    if(/存款准备金|菲利普斯/.test(s)) return '宏观经济';
    if(/liquidity|monetary/.test(s)) return '阅读理解';
    if(/攻击|XSS|DDoS/.test(s)) return '网络安全';
    return null;
  };
  let changed=false;
  /* 资料分析小考点并入大组 */
  const ZL_MERGE = { '基期现期':'增长', '增长量增长率':'增长', '比重倍数平均数':'比重', '速算':'综合' };
  DB.questions.forEach(q=>{
    if(ZL_MERGE[q.exam_point]){ q.exam_point=ZL_MERGE[q.exam_point]; changed=true; }
    if(['计算机科学技术基础','计算机理论','计算机软件及使用','经济金融基础','英语阅读','计算机多选'].includes(q.exam_point)){
      const np=byStem(q.stem+' '+q.analysis);
      if(np){ q.exam_point=np; changed=true; }
    }
  });
  if(changed) save();
}
migrateOldPoints();
function load(){
  try { const d = JSON.parse(localStorage.getItem(DB_KEY)); if(d) return d; } catch(e){}
  return { questions:[], records:[], groups:[], progress:{}, mistakes:[], videos:[], cards:[], tips:[], checkins:[], nextId:1, seeded:false };
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function nid(){ return DB.nextId++; }

/* ================= 打卡 / 每日计划 / 趋势 ================= */
function dayKey(ts){ const d=new Date(ts||Date.now()); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function checkinToday(){ if(!DB.checkins.includes(dayKey())){ DB.checkins.push(dayKey()); save(); } }
function streak(){
  const set=new Set(DB.checkins);
  let n=0, d=new Date();
  if(!set.has(dayKey(d.getTime()))) d.setDate(d.getDate()-1); // 今天还没打卡时,从昨天起算
  while(set.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function todayRecords(){ const k=dayKey(); return DB.records.filter(r=>dayKey(r.t)===k); }
function dueCards(){ return DB.cards.filter(c=>c.next<=Date.now()); }
function dailyPlan(){
  const recs=todayRecords(), todayGroups=DB.groups.filter(g=>dayKey(g.t)===dayKey()).length;
  const todayMistakeRedo = recs.filter(r=>r.redo).length;
  const total=recs.length, correct=recs.filter(r=>r.ok).length;
  return [
    { key:'checkin', name:'每日打卡', done:DB.checkins.includes(dayKey()), note:streak()>1?`连续 ${streak()} 天`:'开始今天' },
    { key:'group', name:'刷一组题（10 题）', done:todayGroups>0||total>=10, note:total?`今天已做 ${total} 题`:'还没开始' },
    { key:'mistake', name:'错题重做 5 题', done:todayMistakeRedo>=5, note:`已重做 ${todayMistakeRedo} 题`, action:"go('quiz',{mode:'redo'})" },
    { key:'recite', name:`背诵复习 ${dueCards().length} 张`, done:dueCards().length===0, note:dueCards().length?`${dueCards().length} 张到期`:'今日已清空', action:"goTab('recite')" },
  ];
}
function trendData(n=12){
  return DB.groups.slice(-n).map(g=>({ acc:g.acc, t:g.t, point:g.point||g.module||'' }));
}
function sparkline(data){
  if(data.length<2) return '';
  const w=300, h=70, pad=6;
  const xs=data.map((_,i)=>pad+i*(w-pad*2)/(data.length-1));
  const ys=data.map(d=>h-pad-(h-pad*2)*Math.min(1,Math.max(0,d.acc)));
  const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const target=h-pad-(h-pad*2)*0.8;
  const last=data[data.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:80px">
    <line class="trendline" x1="${pad}" y1="${target}" x2="${w-pad}" y2="${target}" stroke="#E3E6EC" stroke-dasharray="4 4" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="#0071E3" stroke-width="2" stroke-linejoin="round"/>
    ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="${data[i].acc>=0.8?'#34C759':'#FF3B30'}"/>`).join('')}
    <text x="${w-pad}" y="${target-4}" text-anchor="end" font-size="9" fill="#9A9AA0">80% 过关线</text>
  </svg><div class="hint" style="text-align:right">最近 ${data.length} 组 · 最新 ${Math.round(last.acc*100)}%</div>`;
}
/* 数据备份 */
/* 导出内容：剔除 GitHub token，避免备份文件外传时泄露 */
function exportPayload(){
  const d=JSON.parse(JSON.stringify(DB));
  if(d.settings) delete d.settings.ghToken;
  return JSON.stringify(d,null,2);
}
/* 备份文件名：公路+日期+时间，如 公路20261022-153045.json */
function backupName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `公路${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`;
}
let LAST_BK='';
function exportDB(){
  const payload=exportPayload();
  // App 内：走原生桥直接写入系统「下载」目录，完成后回调 backupDone
  if(window.AndroidBackup && AndroidBackup.save){
    LAST_BK=backupName();
    toast('正在导出备份…');
    AndroidBackup.save(LAST_BK, btoa(unescape(encodeURIComponent(payload))));
    return;
  }
  const blob=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=backupName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('备份已导出');
}
/* 原生桥回调：写入完成弹出确认，可直接跳转系统「下载」文件夹 */
function backupDone(err){
  if(err){ toast('备份保存失败：'+err); return; }
  askConfirm(`备份已保存到系统「下载」文件夹 ✓\n文件名：${LAST_BK}`,
    ()=>{ if(window.AndroidBackup && AndroidBackup.openDownloads) AndroidBackup.openDownloads(); render(); },
    {yes:'打开所在文件夹', no:'关闭'});
}
function importDB(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d || !Array.isArray(d.records)) throw new Error('不是有效的备份文件');
      askConfirm(`导入备份？将覆盖当前数据（${d.records.length} 条记录 / ${d.mistakes?d.mistakes.length:0} 道错题）。`, ()=>{
        localStorage.setItem(DB_KEY, JSON.stringify(d)); location.reload();
      });
    }catch(err){ toast('导入失败：'+err.message); }
  };
  rd.readAsText(f);
}

/* ================= 判分 ================= */
function judge(q, ans){
  const std=q.answer.replace(/\s+/g,'').toUpperCase(), usr=ans.replace(/\s+/g,'').toUpperCase();
  if(!usr) return false;
  if(q.question_type==='多选'){
    const a=[...std].sort().join(''), b=[...usr].sort().join('');
    return a===b;
  }
  return std===usr;
}

let expandedGroup = {}; // 组级伸缩: key = 模块key+':'+组名

/* 隐藏考点: DB.hiddenPoints 存被删除(隐藏)的考点名, 可随时恢复 */
if(!Array.isArray(DB.hiddenPoints)) DB.hiddenPoints = [];
/* 隐藏分组: DB.hiddenGroups 存 "模块key:组名" */
if(!Array.isArray(DB.hiddenGroups)) DB.hiddenGroups = [];
let POINT_EDIT=false;
function isHiddenPoint(p){ return DB.hiddenPoints.includes(p); }
function isHiddenGroup(gk){ return DB.hiddenGroups.includes(gk); }
function hideGroup(gk, name){
  askConfirm(`删除分组「${name}」？组内题目不会丢失，仅不再显示入口。`, ()=>{ DB.hiddenGroups.push(gk); save(); render(); });
}
function restoreGroup(gk){ DB.hiddenGroups=DB.hiddenGroups.filter(x=>x!==gk); save(); render(); }
function hidePoint(p){
  // 统计同名题量: 用户示例题 + 同名真题库考点
  let n = countBy(p);
  Object.keys(BANK_MANIFEST).forEach(k=>{ if(k.split('·')[1]===p) n += BANK_MANIFEST[k]; });
  const doHide = ()=>{ if(!isHiddenPoint(p)) DB.hiddenPoints.push(p); save(); render(); };
  if(n) askConfirm(`「${p}」下还有 ${n} 道题，删除小标题后题目不会丢失，仅不再显示入口。确定删除？`, doHide);
  else doHide();
}
function restorePoint(p){ DB.hiddenPoints=DB.hiddenPoints.filter(x=>x!==p); save(); render(); }
function togglePointEdit(){ POINT_EDIT=!POINT_EDIT; render(); }

/* 模块顺序: DB.moduleOrder 存模块key数组 */
if(!Array.isArray(DB.moduleOrder)) DB.moduleOrder = [];
DB.moduleOrder = [...DB.moduleOrder.filter(k=>MODULES.some(m=>m.key===k)), ...MODULES.filter(m=>!DB.moduleOrder.includes(m.key)).map(m=>m.key)];
let SORT_MODE=false;
function orderedModules(){ return DB.moduleOrder.map(k=>MODULES.find(m=>m.key===k)).filter(Boolean); }
function moveModule(key,dir){
  const a=DB.moduleOrder, i=a.indexOf(key), j=i+dir;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; save(); render();
}
function toggleSortMode(){ SORT_MODE=!SORT_MODE; render(); }

/* 真题库分组名 → APP组名 映射 */
const BANK2GROUP = { '资料分析':'资料分析', '判断推理':'判断推理', '言语理解与表达':'言语理解', '数量关系':'数量关系', '常识判断':'常识/政治', '政治理论':'常识/政治',
  '计算机系统':'计算机系统', '操作系统':'操作系统', '计算机网络':'计算机网络', '数据结构与算法':'数据结构与算法',
  '数据库':'数据库', '程序设计语言':'程序设计语言', '经济金融':'经济金融', '英语':'英语' };
function bankPointsOf(groupName){
  return Object.keys(BANK_MANIFEST).filter(p=>BANK2GROUP[BANK_GROUP[p]]===groupName).sort((a,b)=>BANK_MANIFEST[b]-BANK_MANIFEST[a]);
}
/* 合并同名考点: 示例题考点与真题库考点同名时只显示一行, 题量相加, 点击同时刷两边 */
function mergedEntries(g){
  const bank = {};
  bankPointsOf(g.name).forEach(p=>{ bank[p.split('·')[1]] = p; });
  const out=[], seen=new Set();
  g.items.forEach(it=>{
    if(isHiddenPoint(it)) return;
    const bk = bank[it] || null;
    out.push({ name:it, seed:it, bank:bk, seedCount:countBy(it), bankCount:bk?BANK_MANIFEST[bk]:0 });
    seen.add(it);
  });
  Object.keys(bank).forEach(nm=>{
    if(seen.has(nm) || isHiddenPoint(nm)) return;
    out.push({ name:nm, seed:null, bank:bank[nm], seedCount:0, bankCount:BANK_MANIFEST[bank[nm]] });
  });
  return out;
}

function toggleMod(k){ expanded[k]=!expanded[k]; render(); }
function toggleGroup(k){ expandedGroup[k]=!expandedGroup[k]; render(); }

/* ================= 刷题 ================= */
let QZ = null;
const GROUP_SIZE=10, PASS_GROUPS=3;
function startQuiz(params){
  let pool = [];
  if(params.mode==='redo'){
    // 错题重做: 用错题快照组卷, 错得越多越靠前
    const ms = DB.mistakes.filter(m=>!m.resolved).sort((a,b)=>b.wrong_count-a.wrong_count);
    pool = ms.map(m=>{
      const snap = m.qsnap||{};
      return { id:m.qid, module:snap.module||'', exam_point:snap.exam_point||'', question_type:snap.question_type||(snap.answer&&snap.answer.length>1?'多选':'单选'),
        stem:snap.stem||'', options:snap.options||[], answer:snap.answer||'', analysis:snap.analysis||'', source:'错题重做', _mistakeId:m.id };
    }).filter(q=>q.stem);
    if(!pool.length){ toast('错题本是空的，先去刷题吧'); return; }
  } else if(params.mode==='weak'){
    // 弱项组卷: 最近正确率<80% 的考点 + 错题, 不足则从真题库抽
    const weakPoints = [...new Set(DB.groups.slice(-15).filter(g=>g.acc<0.8&&g.point).map(g=>g.point))];
    weakPoints.forEach(p=>{ if(BANK_DATA[p]) pool=pool.concat(BANK_DATA[p]); });
    pool = pool.concat(DB.mistakes.filter(m=>!m.resolved).map(m=>{
      const s=m.qsnap||{}; return { id:m.qid, module:s.module||'', exam_point:s.exam_point||'', question_type:s.question_type||'单选', stem:s.stem||'', options:s.options||[], answer:s.answer||'', analysis:s.analysis||'', source:'错题重做' };
    }).filter(q=>q.stem));
    const missing = weakPoints.filter(p=>BANK_FILES[p]&&!BANK_DATA[p]);
    if(missing.length && !params._second){
      missing.slice(0,3).forEach(ensureBankPoint);
      setTimeout(()=>go('quiz',{...params,_second:true}), 700);
      toast('正在加载弱项真题…'); return;
    }
    if(pool.length<5){
      const pts = Object.keys(BANK_MANIFEST).filter(p=>BANK_MANIFEST[p]>=10);
      const pick = pts[Math.floor(Math.random()*pts.length)];
      if(pick && !BANK_DATA[pick]){ ensureBankPoint(pick); toast('正在抽取真题…'); setTimeout(()=>go('quiz',{...params,_second:true}),700); return; }
      if(pick) pool = pool.concat(BANK_DATA[pick]);
    }
    if(!pool.length){ toast('暂无足够题目可组卷（先刷几组题或从考点进入）'); return; }
  } else if(params.pi!=null){
    // 历年真题: 整套刷 或 按模块刷
    const P=PAPERS&&PAPERS[params.pi];
    if(!P){ ensurePapers(); return; }
    const pts=params.part?[params.part]:Object.keys(P.pts);
    const missing=pts.filter(pt=>BANK_FILES[pt]&&!BANK_DATA[pt]);
    if(missing.length && !params._second){
      missing.forEach(ensureBankPoint);
      setTimeout(()=>go('quiz',{...params,_second:true}),800);
      return;
    }
    const idset=new Set();
    pts.forEach(pt=>(P.pts[pt]||[]).forEach(id=>idset.add(id)));
    pts.forEach(pt=>{ (BANK_DATA[pt]||[]).forEach(q=>{ if(idset.has(q.id)) pool.push(q); }); });
    if(!pool.length){ toast('该试卷题目加载失败'); return; }
  } else {
    // 同名考点合并后: params.point 刷真题库, params.seedName 刷示例题
    if(params.point && BANK_FILES[params.point] && !BANK_DATA[params.point]){ ensureBankPoint(params.point); return; }
    pool = DB.questions.filter(q=>{
      if(params.seedName) return q.exam_point===params.seedName;
      if(params.point) return q.exam_point===params.point && (q.pass_rate<0||q.pass_rate>0.2);
      return q.source==='真题';
    });
    if(params.point && BANK_DATA[params.point]) pool = pool.concat(BANK_DATA[params.point]);
  }
  if(pool.length===0){
    if(params.point && BANK_FILES[params.point] && !BANK_DATA[params.point]) return; // 加载中, viewQuiz 会显示提示
    toast(params.point ? '该考点暂无题目，请先到「导入题库」录入题目' : '真题已按考点拆分，请从下方「行测」的具体考点进入刷题'); return;
  }
  const size = params.pi!=null ? pool.length : (params.mode==='weak' ? 20 : GROUP_SIZE);
  pool = params.pi!=null ? pool : pool.slice().sort(()=>Math.random()-.5).slice(0, size); // 试卷模式保持原卷顺序
  QZ = { qs:pool, idx:0, sel:[], marked:false, show:false, recs:[], gid:Date.now(), params,
         done:false, target: params.mode==='redo'?0.9:0.8, mode:params.mode||'', t0:Date.now(), q0:Date.now(), warned:false };
}
function viewQuiz(){
  if(S.params.point && BANK_FILES[S.params.point] && !BANK_DATA[S.params.point]){
    ensureBankPoint(S.params.point);
    return `<div class="empty">真题加载中…（${BANK_MANIFEST[S.params.point]}题）</div>`;
  }
  if(!QZ || QZ.params!==S.params) startQuiz(S.params);
  if(!QZ) return `<div class="empty">${S.params.mode?'正在组卷，请稍候…':'真题加载中…'}</div>`;
  if(QZ.done) return quizResult();
  startTicker();
  const q = QZ.qs[QZ.idx];
  const isMulti = q.question_type==='多选';
  const std = q.answer.toUpperCase();
  let h = `<div class="qprog"><span>${QZ.idx+1}/${QZ.qs.length}${isMulti?' · 多选':''}${QZ.mode?' · '+(QZ.mode==='redo'?'错题重做':'弱项组卷'):''}</span>
    <span><span class="qtimer" id="qtime">00:00</span><span class="qflag" style="margin-left:10px" onclick="qzFlag()">${QZ.marked?'⚑ 已标记拿不准':'⚐ 拿不准'}</span><span class="qflag" style="margin-left:10px" onclick="qzSettings()">🎨</span></span></div>`;
  if(QZ.slowWarn) h += `<div class="warnbar">⏰ 本题已超 2 分钟，按考场习惯：标记跳过，别死磕</div>`;
  if(QZ.showSettings) h += settingsCard();
  h += `<div class="stem">${rich(q.stem)}</div>${q.source?`<div class="qsrc">${esc(q.source)}</div>`:''}`;
  const opts = q.options.length ? q.options : (q.question_type==='判断' ? ['对','错'] : []);
  opts.forEach((opt,i)=>{
    const L = q.options.length ? String.fromCharCode(65+i) : opt;
    let cls='opt';
    if(QZ.show){
      if(std.includes(L)) cls+=' right';
      else if(QZ.sel.includes(L)) cls+=' wrong';
    } else if(QZ.sel.includes(L)) cls+=' on';
    h += `<div class="${cls}" onclick="qzToggle('${L}')">${rich(opt)}</div>`;
  });
  if(QZ.show){
    h += `<div class="ana"><b>答案：${q.answer}</b>${q.analysis?`<p>${rich(q.analysis)}</p>`:''}</div>`;
    h += `<button class="btn" onclick="qzNext()">${QZ.idx+1>=QZ.qs.length?'查看本组结果':'下一题'}</button>`;
  } else {
    h += `<button class="btn" ${QZ.sel.length?'':'disabled'} onclick="qzSubmit()">提交</button>`;
  }
  return h;
}
function qzToggle(L){
  if(QZ.show) return;
  const isMulti = QZ.qs[QZ.idx].question_type==='多选';
  if(isMulti){ const i=QZ.sel.indexOf(L); i>=0?QZ.sel.splice(i,1):QZ.sel.push(L); }
  else QZ.sel=[L];
  render();
}
function qzFlag(){ QZ.marked=!QZ.marked; render(); }
/* 计时器: 每秒刷新题内用时; 超2分钟提醒(每题只提醒一次) */
let TICK=null;
function fmtSec(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function startTicker(){
  if(TICK) clearInterval(TICK);
  TICK=setInterval(()=>{
    if(!QZ || QZ.done || S.view!=='quiz'){ clearInterval(TICK); TICK=null; return; }
    const el=document.getElementById('qtime');
    const sec=Math.floor((Date.now()-QZ.q0)/1000);
    if(el) el.textContent=fmtSec(sec)+(QZ.show?' ✓':'');
    if(sec>=120 && !QZ.warned){ QZ.warned=true; QZ.slowWarn=true; render(); }
  },1000);
}
function doCheckin(){ checkinToday(); render(); toast(`打卡成功 · 连续 ${streak()} 天`); }
function qzSettings(){ QZ.showSettings=!QZ.showSettings; render(); }
function qzSubmit(){
  if(!QZ.sel.length) return;
  const q=QZ.qs[QZ.idx], ans=QZ.sel.slice().sort().join(''), ok=judge(q,ans);
  const ms=Date.now()-QZ.q0;
  QZ.recs.push({q, ans, ok, marked:QZ.marked, ms, redo:QZ.mode==='redo'});
  QZ.show=true;
  const rec={ qid:q.id, gid:QZ.gid, ans, ok:ok?1:0, marked:QZ.marked?1:0, t:Date.now(), ms };
  if(QZ.mode==='redo') rec.redo=1;
  DB.records.push(rec);
  if(!ok || QZ.marked){
    let m = DB.mistakes.find(m=>m.qid===q.id);
    if(m){ m.wrong_count++; m.updated=Date.now(); m.marked_src=QZ.marked?1:m.marked_src; }
    else DB.mistakes.push({ id:nid(), qid:q.id, reason:'', wrong_count:1, marked_src:QZ.marked?1:0, resolved:0, created:Date.now(), updated:Date.now(),
      qsnap:{ module:q.module, exam_point:q.exam_point, question_type:q.question_type, stem:q.stem, options:q.options, answer:q.answer, analysis:q.analysis } });
  } else if(QZ.mode==='redo'){
    // 错题重做答对: 标记为已掌握
    const m = DB.mistakes.find(m=>m.qid===q.id);
    if(m){ m.resolved=1; m.updated=Date.now(); }
  }
  save(); render();
}
function qzNext(){
  if(QZ.idx+1>=QZ.qs.length){ finishGroup(); }
  else { QZ.idx++; QZ.sel=[]; QZ.marked=false; QZ.show=false; QZ.q0=Date.now(); QZ.warned=false; QZ.slowWarn=false; }
  render();
}
function progKey(){ const q=QZ.qs[0]; return (q?q.module:'')+'|'+(S.params.point||''); }
function finishGroup(){
  const total=QZ.recs.length, correct=QZ.recs.filter(r=>r.ok).length, acc=total?correct/total:0;
  DB.groups.push({ gid:QZ.gid, module:QZ.qs[0].module, point:S.params.point||'', total, correct, acc, t:Date.now() });
  const k=progKey();
  const p = DB.progress[k] || { consecutive:0, passed:0 };
  p.consecutive = acc>=QZ.target ? p.consecutive+1 : 0;
  if(p.consecutive>=PASS_GROUPS) p.passed=1;
  DB.progress[k]=p;
  QZ.done=true; save();
}
function quizResult(){
  if(TICK){ clearInterval(TICK); TICK=null; }
  const correct=QZ.recs.filter(r=>r.ok).length, total=QZ.recs.length;
  const acc=total?Math.round(correct/total*100):0;
  const p=DB.progress[progKey()]||{consecutive:0,passed:0};
  const totalMs=QZ.recs.reduce((n,r)=>n+(r.ms||0),0);
  const avg=total?Math.round(totalMs/total/1000):0;
  const slow=QZ.recs.filter(r=>(r.ms||0)>120000).length;
  let diag='';
  if(QZ.mode==='weak'||QZ.qs.length>=20){
    diag = (avg>90 && acc<80) ? '诊断：速度与正确率双低 → 先回归专项，把考点练到 80% 再上套卷'
         : (avg>90) ? '诊断：正确率达标但单题偏慢 → 主攻速度（速算/跳题）'
         : (acc<80) ? '诊断：速度没问题，正确率不足 → 主攻错因复盘'
         : '诊断：节奏与正确率都达标，保持';
  }
  return `<div class="center">
    <div class="bigscore">${acc}%</div>

function importFile(input){
  const f=input.files[0]; if(!f) return;
  const log=(t)=>{ document.getElementById('ilog').innerHTML+=`<div class="card log">${t}</div>`; };
  log('读取: '+f.name);
  const reader=new FileReader();

      } else if(isText){

      } else {
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).forEach(r=>insertQ(r)?ok++:fail++);
      }

}

/* Markdown/TXT 题库解析: 空行分题, # 行设置上下文(模块/题型/考点) */
function parseTextBank(text){
  const rows=[];
  let ctx={module:'',type:'',point:'',source:''};
  // 去掉 markdown 装饰: **加粗**、> 引用、行首 # 由 header 处理
  const clean=s=>s.replace(/\*\*/g,'').replace(/^>\s?/,'').trim();
  const blocks=text.replace(/\r\n?/g,'\n').split(/\n\s*\n/);
  blocks.forEach(block=>{
    const lines=block.split('\n').map(clean).filter(l=>l);
    if(!lines.length) return;
    // 纯 header 块(全是 # 开头): 更新上下文
    if(lines.every(l=>l.startsWith('#'))){
      lines.forEach(l=>{
        const body=l.replace(/^#+\s*/,'');
        // 支持 "模块:行测 题型:单选 考点:基期现期" 或 "module=行测"
        const kv=[...body.matchAll(/(模块|题型|考点|来源|module|type|point|source)\s*[:：=]\s*([^\s,，;；]+)/g)];
        kv.forEach(m=>{
          const k=m[1], v=m[2];
          if(k==='模块'||k==='module') ctx.module=v;
          else if(k==='题型'||k==='type') ctx.type=v;
          else if(k==='考点'||k==='point') ctx.point=v;
          else if(k==='来源'||k==='source') ctx.source=v;
        });
      });
      return;
    }
    // 题块解析
    let stemLines=[], options=[], answer='', analysis='', source=ctx.source;
    lines.forEach(l=>{
      let m;
      if(m=l.match(/^([A-F])\s*[.、．:：]\s*(.+)$/)){ options.push(m[1]+'. '+m[2]); }
      else if(m=l.match(/^(答案|answer)\s*[:：]\s*(.+)$/i)){ answer=m[2]; }
      else if(m=l.match(/^(解析|analysis)\s*[:：]\s*(.+)$/i)){ analysis=m[2]; }
      else if(m=l.match(/^(来源|source)\s*[:：]\s*(.+)$/i)){ source=m[2]; }
      else if(l.startsWith('#')){ /* 块内混排header忽略, 上下文已在外层处理 */ }
      else { stemLines.push(l.replace(/^\d+\s*[.、．)]\s*/,'')); } // 去题号
    });
    const stem=stemLines.join('\n').trim();
    answer=answer.trim().toUpperCase().replace(/[，,\s]/g,'');
    if(!stem||!answer) return;
    // 题型推断
    let qtype=ctx.type||'单选';
    if(/^[A-F]{2,}$/.test(answer)) qtype='多选';
    else if(/^(对|错|T|F|√|×)$/.test(answer)){ qtype='判断'; answer=/^(对|T|√)$/.test(answer)?'对':'错'; }
    rows.push({ module:ctx.module||'未分类', question_type:qtype, exam_point:ctx.point,
      stem, options, answer, analysis, source });
  });
  return rows;
}
function insertQ(row){
  const stem=String(row.stem||row.题干||'').trim();
  const answer=String(row.answer||row.答案||'').trim().toUpperCase();
  const module=String(row.module||row.模块||'').trim();
  if(!stem||!answer||!module) return false;
  let options=[];
  if(row.options){ options=Array.isArray(row.options)?row.options:[]; }
  else options=['A','B','C','D','E','F'].map(L=>row[L]??row['选项'+L])
    .filter(v=>v!==undefined&&String(v).trim()!=='')
    .map((v,i)=>String.fromCharCode(65+i)+'. '+String(v).trim());
  DB.questions.push({ id:nid(), module, question_type:String(row.question_type||row.题型||'单选').trim(),
    exam_point:String(row.exam_point||row.考点||'').trim(), subtype:String(row.subtype||'').trim(),
    stem, options, answer, analysis:String(row.analysis||row.解析||''), source:String(row.source||row.来源||''), pass_rate:Number(row.pass_rate)||-1 });
  return true;
}

/* 本地视频 blob 存 IndexedDB，重启后仍可播放 */
let IDB=null;
function idb(){ return new Promise((res,rej)=>{ if(IDB) return res(IDB);
  const r=indexedDB.open('kg_media',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('videos');
  r.onsuccess=()=>{IDB=r.result;res(IDB)}; r.onerror=()=>rej(r.error); }); }
function idbPut(k,blob){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').put(blob,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })); }
function idbGet(k){ return idb().then(db=>new Promise((res,rej)=>{ const rq=db.transaction('videos').objectStore('videos').get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
function idbDel(k){ return idb().then(db=>new Promise(res=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(k); tx.oncomplete=res; })); }

function openVideo(id){

      window.scrollTo(0,0);

}

    save(); render();
  });

    <span class="${RC_MODE==='due'?'':'x'}" style="${RC_MODE==='due'?'color:#0071E3;font-weight:700':''}" onclick="rcMode('due')">待复习</span>
    <span style="${RC_MODE==='all'?'color:#0071E3;font-weight:700':''}" onclick="rcMode('all')">全部(${DB.cards.length})</span>
    <b style="margin-left:auto" onclick="rcToggleAdd()">${RC_ADD?'收起':'＋ 新卡'}</b>
  </div>`;
  if(RC_ADD){
    h+=`<div class="card">
      <div class="ptitle">新建卡片</div>
      <input type="text" id="rcDeck" list="deckList" placeholder="卡组（如 花生800词 / 时政）" style="width:100%;margin-bottom:8px">
      <datalist id="deckList">${decks().map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
      <textarea id="rcFront" rows="2" placeholder="正面：词语 / 问题" style="width:100%;margin-bottom:8px"></textarea>
      <textarea id="rcBack" rows="2" placeholder="背面：释义 / 答案" style="width:100%;margin-bottom:8px"></textarea>
      <button class="btn" onclick="rcAddOne()">保存卡片</button>
      <div class="ptitle" style="margin-top:14px">批量导入</div>
      <div class="hint" style="margin-bottom:6px">每行一张卡，格式：正面|背面（卡组同上）</div>
      <textarea id="rcBatch" rows="4" placeholder="冗长|多余、啰嗦&#10;甄别|辨别真假、优劣" style="width:100%;margin-bottom:8px"></textarea>
      <button class="btn ghost" onclick="rcAddBatch()">批量导入</button>
    </div>`;
  }
  if(decks().length>1){
    h+=`<div class="reasons" style="margin:0 0 10px"><span class="reason ${RC_DECKF===''?'on':''}" onclick="rcDeckF('')">全部</span>${decks().map(d=>`<span class="reason ${RC_DECKF===d?'on':''}" onclick="rcDeckF('${esc(d)}')">${esc(d)}</span>`).join('')}</div>`;
  }
  if(!list.length) h+=`<div class="empty">${RC_MODE==='due'?'今日复习完成 🎉':'暂无卡片，点右上角「＋ 新卡」创建'}</div>`;
  list.forEach(c=>{
    const flip=RC_FLIP[c.id];
    h+=`<div class="rcard" onclick="rcFlip(${c.id})">
      <div class="rtag">${esc(c.deck)} · 阶段${c.stage}<span style="float:right" onclick="event.stopPropagation();rcDel(${c.id})">🗑</span></div>
      <div class="rfront">${esc(c.front)}</div>
      ${flip?`<div class="rback">${esc(c.back)}</div>`:''}
      ${flip&&RC_MODE==='due'?`<div class="rrow">
        <button class="rno" onclick="event.stopPropagation();rcReview(${c.id},false)">忘了</button>
        <button class="ryes" onclick="event.stopPropagation();rcReview(${c.id},true)">记得</button>
      </div>`:''}
      ${!flip?`<div class="rhint">点击查看答案</div>`:''}
    </div>`;
  });
  return h;
}
function rcMode(m){ RC_MODE=m; render(); }
function rcDeckF(d){ RC_DECKF=d; render(); }
function rcToggleAdd(){ RC_ADD=!RC_ADD; render(); }
function rcFlip(id){ RC_FLIP[id]=!RC_FLIP[id]; render(); }
function rcDel(id){ askConfirm('删除这张卡片？', ()=>{ DB.cards=DB.cards.filter(c=>c.id!==id); save(); render(); }); }
function rcReview(id, ok){
  const c=DB.cards.find(c=>c.id===id); if(!c) return;
  const stage=ok?Math.min(c.stage+1,EBBINGHAUS.length-1):0;
  c.stage=stage; c.next=Date.now()+EBBINGHAUS[stage]*86400000;
  delete RC_FLIP[id]; save(); render();
}
function rcAddOne(){
  const deck=(document.getElementById('rcDeck').value||'').trim()||'默认';
  const front=(document.getElementById('rcFront').value||'').trim();
  const back=(document.getElementById('rcBack').value||'').trim();
  if(!front){ toast('正面不能为空'); return; }
  DB.cards.push({ id:nid(), deck, front, back, stage:0, next:Date.now(), created:Date.now() });
  document.getElementById('rcFront').value=''; document.getElementById('rcBack').value='';
  save(); render();
}
function rcAddBatch(){
  const deck=(document.getElementById('rcDeck').value||'').trim()||'默认';
  const text=document.getElementById('rcBatch').value||'';
  let n=0;
  text.split('\n').forEach(line=>{
    const parts=line.split(/[|｜]/);
    if(parts.length>=2 && parts[0].trim()){
      DB.cards.push({ id:nid(), deck, front:parts[0].trim(), back:parts.slice(1).join('|').trim(), stage:0, next:Date.now(), created:Date.now() });
      n++;
    }
  });
  toast(`已导入 ${n} 张卡片到「${deck}」`);
  save(); render();
}

function viewShenlun(){
  if(!SL_PAPERS){ ensureShenlun(); return `<div class="empty">申论题库加载中…</div>`; }
  const p = SL_PAPERS.find(x=>x.id===S.params.pid);
  if(!p) return `<div class="empty">未找到该套卷</div>`;
  if(SL_Q===null){
    let h = `<div class="pname" style="font-size:17px">${esc(p.title)}</div>
    <div class="pline">${p.year||''} ${esc(p.variant||'')} · ${p.questions.length} 题 · 建议 ${p.duration_min||180} 分钟 · 满分 ${p.total_score||100} 分</div>`;
    if(p.materials.length){
      h += `<div class="reasons" style="margin-bottom:10px">${p.materials.map((m,i)=>`<span class="reason ${SL_P===i?'on':''}" onclick="slToggleMat(${i})">${esc(m.name)}</span>`).join('')}</div>`;
      if(SL_P!==null) h += `<div class="mat">${esc(p.materials[SL_P].text)}</div><div class="hint" style="text-align:center">建议通读全部材料再作答</div>`;
    }
    h += p.questions.map((q,i)=>{
      const logged = SL_LOGGED[p.id+'-'+i];
      return `<div class="card" onclick="slOpenQ(${i})">
        <div class="mrow"><span class="mtag">${esc(q.type)}</span><span class="mtag">${q.score}分</span><span class="mtag">${q.word_limit?'建议'+q.word_limit+'字':''}</span>${logged?`<span class="marktag">已练</span>`:''}</div>
        <div class="mstem">${esc(q.stem).slice(0,80)}${q.stem.length>80?'…':''}</div></div>`;
    }).join('');
    return h;
  }
  // 单题页
  const q = p.questions[SL_Q], uid = p.id+'-'+SL_Q;
  const pts = SL_PTS[uid]||{};
  const npts = q.points.length, nchk = Object.values(pts).filter(Boolean).length;
  const found = npts? nchk/npts>=0.8 : false;
  let h = `<div class="qprog"><span>第${q.no}题 · ${esc(q.type)} · ${q.score}分</span><span class="qflag" onclick="slOpenQ(null)">‹ 返回本卷</span></div>`;
  if(p.materials.length){
    h += `<div class="reasons" style="margin-bottom:10px">${p.materials.map((m,i)=>`<span class="reason ${SL_P===i?'on':''}" onclick="slToggleMat(${i})">${esc(m.name)}</span>`).join('')}</div>`;
    if(SL_P!==null) h += `<div class="mat">${esc(p.materials[SL_P].text)}</div>`;
  }
  h += `<div class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</div>`;
  h += `<textarea id="slDraft" rows="6" placeholder="在纸上或这里作答（此处内容不会保存）" style="width:100%"></textarea>`;
  if(!SL_REF[uid]){
    h += `<button class="btn ghost" onclick="slToggleRef()">写完了，对照参考答案</button>`;
  } else {
    h += `<div class="ana"><b>参考答案</b><p style="white-space:pre-wrap">${esc(q.reference)}</p></div>`;
    if(npts){
      h += `<div class="card"><div class="ptitle">要点自查（阅卷按点给分 · 勾你写中的）</div>`;
      q.points.forEach((pt,i)=>{
        h += `<div class="pline" onclick="slTogglePt('${uid}',${i})">${pts[i]?'☑':'☐'} ${esc(pt)}</div>`;
      });
      h += `<div class="hint">已勾 ${nchk}/${npts} · ${found?'达到80%标准':'未达80%标准'}</div></div>`;
    }
    h += SL_LOGGED[uid]
      ? `<div class="center"><div class="passtag">已记入练习记录</div></div>`
      : `<button class="btn" onclick="slLog('${uid}',${found?1:0})">记入练习记录（${found?'要点找全':'要点未找全'}）</button>`;
  }
  return h;
}
function slOpenQ(i){ SL_Q=i; SL_P=null; render(); window.scrollTo(0,0); }

function slToggleRef(){ const uid=slUid(); SL_REF[uid]=true; render(); }

  DB.records.push({ qid:'sl:'+uid, gid:'sl', ans:'self', ok, marked:0, t:Date.now() });
  SL_LOGGED[uid]=1; save(); render();
}

    <div class="hint" style="text-align:left;margin:0 0 8px">数据存在本机浏览器，清缓存会丢失。建议每周导出一次。</div>
    <div class="actions">
      <button onclick="exportDB()">⬆ 导出备份</button>
      <label class="btn ghost" style="text-align:center;cursor:pointer">⬇ 导入备份
        <input type="file" accept=".json" onchange="importDB(this)"></label>
    </div>
    <div class="gname" style="margin-top:12px">GitHub 云备份（备份文件会包含下方 token，请勿外传）</div>
    <input type="text" id="ghRepo" placeholder="仓库（如 lionheart6666/demo）" value="${esc(DB.settings.ghRepo||'')}" style="width:100%;margin-bottom:8px">
    <input type="text" id="ghTok" placeholder="GitHub Token（repo 权限）" value="${esc(DB.settings.ghToken||'')}" style="width:100%;margin-bottom:8px">
    <div class="actions">
      <button class="btn ghost" onclick="ghSaveCfg()">保存配置</button>
      <button onclick="ghUpload()">☁ 上传备份到 GitHub</button>
    </div>
  </div>
  ${settingsCard()}
  ${baselineCard()}
  <button class="btn ghost" onclick="resetAll()">清空全部数据（重置）</button>`;
}
function resetAll(){ askConfirm('确定清空所有题库、记录、卡片？', ()=>{ localStorage.removeItem(DB_KEY); location.reload(); }); }

/* ================= 打卡日历热力图 ================= */
let CAL_Y=null, CAL_M=null; // 当前查看的月份（默认本月）
function calendarHeat(){
  const now=new Date();
  const y=CAL_Y||now.getFullYear(), m=(CAL_M==null?now.getMonth():CAL_M);
  // 每日做题数
  const cnt={};
  DB.records.forEach(r=>{ const k=dayKey(r.t); cnt[k]=(cnt[k]||0)+1; });
  const max=Math.max(1,...Object.values(cnt));
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const offset=(first.getDay()+6)%7; // 周一开头
  const today=dayKey();
  let h=`<div class="calnav"><span onclick="calShift(-1)">‹ 上月</span><b>${y} 年 ${m+1} 月</b><span onclick="calShift(1)">下月 ›</span></div>`;
  h+=`<div class="calgrid">${['一','二','三','四','五','六','日'].map(d=>`<div class="calhead">${d}</div>`).join('')}`;
  for(let i=0;i<offset;i++) h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const k=dayKey(new Date(y,m,d).getTime());
    const n=cnt[k]||0;
    const a=n?Math.min(0.88,0.18+0.7*n/max):0;
    const style=n?`background:rgba(10,132,255,${a.toFixed(2)});color:${a>0.5?'#fff':'var(--text2)'}`:'';
    h+=`<div class="calcell ${k===today?'today':''}" style="${style}" title="${k}：${n} 题">${d}${DB.checkins.includes(k)?'<span class="cdot"></span>':''}</div>`;
  }
  h+=`</div><div class="hint" style="text-align:right;margin-top:6px">橙点=已打卡 · 蓝色深浅=当日做题数</div>`;
  return h;
}
function calShift(dir){
  const now=new Date();
  let y=CAL_Y||now.getFullYear(), m=(CAL_M==null?now.getMonth():CAL_M)+dir;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  CAL_Y=y; CAL_M=m; render();
}

/* ================= 备考基线（可编辑） ================= */
const BASELINE_DEFAULT=['行测 50-60 分 → 目标 70+','专业课 33/100 → 目标 70+','考试: 2026-11-28 专业课 / 11-29 行测申论'];
let BASE_EDIT=false;
function baselineLines(){ return Array.isArray(DB.settings.baseline)?DB.settings.baseline:BASELINE_DEFAULT; }
function baselineCard(){
  if(BASE_EDIT){
    return `<div class="card"><div class="ptitle">备考基线</div>
      <div class="hint" style="margin:0 0 8px">每行一条</div>
      <textarea id="baseT" rows="4" style="width:100%">${esc(baselineLines().join('\n'))}</textarea>
      <div class="actions"><button class="btn" onclick="baseSave()">保存</button><button class="btn ghost" onclick="baseEditToggle()">取消</button></div></div>`;
  }
  return `<div class="card"><div class="ptitle">备考基线 <span style="float:right;font-size:12px;color:var(--accent);font-weight:400;cursor:pointer" onclick="baseEditToggle()">编辑</span></div>
    ${baselineLines().map(l=>`<div class="pline">${esc(l)}</div>`).join('')}</div>`;
}
function baseEditToggle(){ BASE_EDIT=!BASE_EDIT; render(); }
function baseSave(){
  const lines=(document.getElementById('baseT').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  DB.settings.baseline=lines.length?lines:BASELINE_DEFAULT.slice();
  BASE_EDIT=false; save(); render();
}

/* ================= GitHub 云备份 ================= */
function ghSaveCfg(){
  DB.settings.ghRepo=(document.getElementById('ghRepo').value||'').trim();
  DB.settings.ghToken=(document.getElementById('ghTok').value||'').trim();
  save(); toast('已保存 GitHub 配置'); render();
}
async function ghUpload(){
  const tok=(DB.settings.ghToken||'').trim(), repo=(DB.settings.ghRepo||'').trim();
  if(!tok||!repo){ toast('请先填写仓库和 Token 并保存'); return; }
  toast('正在上传备份…');
  const path='backups/kaogong-backup-'+dayKey()+'.json';
  const api='https://api.github.com/repos/'+repo+'/contents/'+path;
  const head={ 'Authorization':'Bearer '+tok, 'Accept':'application/vnd.github+json' };
  try{
    let sha;
    const cur=await fetch(api,{headers:head});
    if(cur.ok){ sha=(await cur.json()).sha; }
    const content=btoa(unescape(encodeURIComponent(exportPayload())));
    const r=await fetch(api,{ method:'PUT', headers:{...head,'Content-Type':'application/json'},
      body:JSON.stringify({ message:'chore: 公路备份 '+dayKey(), content, ...(sha?{sha}:{}) }) });
    if(r.ok) toast('备份已上传到 GitHub ✓');
    else if(r.status===401||r.status===403) toast('Token 无效或权限不足');
    else if(r.status===404) toast('仓库不存在或无写权限');
    else toast('上传失败: HTTP '+r.status);
  }catch(e){ toast('网络错误，上传失败（手机需联网）'); }
}

/* ================= 应用内确认弹层（替代 confirm，预览环境禁用了原生对话框） ================= */
let CONFIRM_ASK=null;
function askConfirm(msg, onYes, labels){ CONFIRM_ASK={msg,onYes,yesLabel:labels&&labels.yes,noLabel:labels&&labels.no}; render(); }
function confirmYes(){ const c=CONFIRM_ASK; CONFIRM_ASK=null; if(c&&c.onYes) c.onYes(); else render(); }
function confirmNo(){ CONFIRM_ASK=null; render(); }
let TOAST=null, TOAST_T=null;
let RENDERING=false;
function toast(msg){
  TOAST=msg; clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>{ TOAST=null; render(); }, 2200);
  if(!RENDERING) render(); // 渲染流程中触发的 toast 不再重入 render，防止定时器被无限重置
}

/* ================= 渲染 ================= */
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  const app=document.getElementById('app');
  let content='';
  switch(S.view){
    case 'practice': content=viewPractice(); break;
    case 'quiz': content=viewQuiz(); break;
    case 'shenlun': content=viewShenlun(); break;
    case 'mistake': content=viewMistake(); break;
    case 'import': content=viewImport(); break;
    case 'course': content=viewCourse(); break;
    case 'recite': content=viewRecite(); break;
    case 'tips': content=viewTips(); break;
    case 'mindmap': content=viewMindmap(); break;
    case 'papers': content=viewPapers(); break;
    case 'paper': content=viewPaper(); break;
    case 'profile': content=viewProfile(); break;
  }
  const isStack=STACK.includes(S.view);
  const backAct = S.view==='paper' ? "go('papers')" : `goTab('${S.tab}')`;
  const header=`<div class="header">${isStack?`<span class="back" onclick="${backAct}">‹ 返回</span>`:''}${TITLES[S.view]||''}</div>`;
  const tabbar=`<div class="tabbar">${TABS.map(t=>
    `<div class="tab ${S.tab===t.k&&!isStack?'on':''}" onclick="goTab('${t.k}')"><span class="ic">${icon(t.ic)}</span>${t.n}</div>`).join('')}</div>`;
  const modal = CONFIRM_ASK ? `<div class="overlay"><div class="dialog"><div class="dmsg">${esc(CONFIRM_ASK.msg)}</div>
    <div class="drow"><button class="btn ghost" onclick="confirmNo()">${CONFIRM_ASK.noLabel||'取消'}</button><button class="btn" onclick="confirmYes()">${CONFIRM_ASK.yesLabel||'确定'}</button></div></div></div>` : '';
  const toastEl = TOAST ? `<div class="toast">${esc(TOAST)}</div>` : '';
  RENDERING=true;
  app.innerHTML=header+`<div class="body">${content}</div>`+tabbar+modal+toastEl;
  RENDERING=false;
}
applySettings();
render();
</script>
